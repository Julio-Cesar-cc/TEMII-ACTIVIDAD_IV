{% extends "base.html" %}
{% block content %}
<h2>Gestión de Usuarios</h2>
<a href="{{ url_for('users.create') }}" class="btn btn-primary mb-3">+ Nuevo Usuario</a>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Admin</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>{{ 'Sí' if u.is_admin else 'No' }}</td>
            <td>
                <a href="{{ url_for('users.delete', id=u.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
